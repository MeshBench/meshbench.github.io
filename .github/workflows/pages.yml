name: Pages

# The site is static and committed, so the job uploads the tree as it stands.
# Nothing is built here; brand assets come from MeshBench/brand and are copied
# in deliberately rather than fetched at deploy time.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Pages serves a private repository only on Pro, Team or Enterprise,
    # and this organisation is on Free: the deploy step answers "Your current
    # plan does not support GitHub Pages for this repository". Skipped rather
    # than failed, so the history is not a column of red crosses for a condition
    # nobody can fix by changing this file. It runs the moment the repository is
    # public, and a manual run covers the case where the plan changed instead.
    if: github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
